<svg viewBox="0 0 600 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rgLineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="rgFillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <!-- Puncak Gonjong Fill & Outer Contour -->
  <path
    d="M 40 38
       Q 48 85, 110 108
       Q 138 80, 165 52
       Q 185 82, 210 102
       Q 228 82, 245 65
       Q 275 98, 300 115
       Q 325 98, 355 65
       Q 372 82, 390 102
       Q 415 82, 435 52
       Q 462 80, 490 108
       Q 552 85, 560 38
       Q 568 95, 570 142
       Q 300 165, 30 142
       Q 32 95, 40 38 Z"
    fill="url(#rgFillGrad)"
    stroke="url(#rgLineGrad)"
    stroke-width="1.75"
    stroke-linejoin="round"
  />

  <!-- Garis Punggung Atap Utama (Perabung) -->
  <path
    d="M 40 38
       Q 48 85, 110 108
       Q 138 80, 165 52
       Q 185 82, 210 102
       Q 228 82, 245 65
       Q 275 98, 300 115
       Q 325 98, 355 65
       Q 372 82, 390 102
       Q 415 82, 435 52
       Q 462 80, 490 108
       Q 552 85, 560 38"
    stroke="url(#rgLineGrad)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Tingkat Atap Kedua / Teritisan Eaves -->
  <path
    d="M 28 142 Q 300 166, 572 142"
    stroke="url(#rgLineGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <path
    d="M 45 156 Q 300 176, 555 156"
    stroke="url(#rgLineGrad)"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Lis Dinding / Singkok Bagian Atas -->
  <path
    d="M 88 162 L 115 214 L 485 214 L 512 162"
    stroke="url(#rgLineGrad)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Lantai Panggung -->
  <line x1="95" y1="214" x2="505" y2="214" stroke="url(#rgLineGrad)" stroke-width="2.5" />
  <line x1="95" y1="218" x2="505" y2="218" stroke="url(#rgLineGrad)" stroke-width="1.2" />

  <!-- Tiang-Tiang Kolong Rumah Gadang -->
  <line x1="120" y1="218" x2="120" y2="248" stroke="url(#rgLineGrad)" stroke-width="2" />
  <line x1="160" y1="218" x2="160" y2="248" stroke="url(#rgLineGrad)" stroke-width="1.75" />
  <line x1="200" y1="218" x2="200" y2="248" stroke="url(#rgLineGrad)" stroke-width="1.75" />
