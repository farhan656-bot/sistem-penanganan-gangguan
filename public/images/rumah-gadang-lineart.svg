  <rect x="185" y="176" width="16" height="24" rx="2" stroke="url(#rgLineGrad)" stroke-width="1.2" />
  <rect x="225" y="176" width="16" height="24" rx="2" stroke="url(#rgLineGrad)" stroke-width="1.2" />
  <rect x="265" y="176" width="16" height="24" rx="2" stroke="url(#rgLineGrad)" stroke-width="1.2" />
  <rect x="319" y="176" width="16" height="24" rx="2" stroke="url(#rgLineGrad)" stroke-width="1.2" />
  <rect x="359" y="176" width="16" height="24" rx="2" stroke="url(#rgLineGrad)" stroke-width="1.2" />
  <rect x="399" y="176" width="16" height="24" rx="2" stroke="url(#rgLineGrad)" stroke-width="1.2" />
  <rect x="439" y="176" width="16" height="24" rx="2" stroke="url(#rgLineGrad)" stroke-width="1.2" />

  <!-- Pintu / Jenjang Tengah -->
  <path d="M 292 214 L 292 188 Q 300 184, 308 188 L 308 214 Z" stroke="url(#rgLineGrad)" stroke-width="1.5" />
</svg>