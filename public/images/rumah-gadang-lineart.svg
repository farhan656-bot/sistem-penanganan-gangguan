  <line x1="280" y1="218" x2="280" y2="248" stroke="url(#rgLineGrad)" stroke-width="1.75" />
  <line x1="320" y1="218" x2="320" y2="248" stroke="url(#rgLineGrad)" stroke-width="1.75" />
  <line x1="360" y1="218" x2="360" y2="248" stroke="url(#rgLineGrad)" stroke-width="1.75" />
  <line x1="400" y1="218" x2="400" y2="248" stroke="url(#rgLineGrad)" stroke-width="1.75" />
  <line x1="440" y1="218" x2="440" y2="248" stroke="url(#rgLineGrad)" stroke-width="1.75" />
  <line x1="480" y1="218" x2="480" y2="248" stroke="url(#rgLineGrad)" stroke-width="2" />

